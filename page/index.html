<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPCUI Playground — Trình mô phỏng GUI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0e0806; --bg2: #160d0a;
    --panel: #1e110d; --panel2: #281711;
    --accent: #ff5a1e; --accent2: #ff9155;
    --text: #f2eeea; --text-dim: #a5948c;
    --stroke: #552d1e;
    --success: #46dc6e; --danger: #ff4646; --warning: #ffc846;
  }

  html, body {
    height: 100%;
    background: #0a0505;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }

  /* ============ HEADER ============ */
  .header {
    height: 56px;
    background: linear-gradient(90deg, var(--bg), var(--bg2));
    border-bottom: 1px solid var(--stroke);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    position: relative;
    z-index: 100;
    flex-shrink: 0;
  }

  .header .logo-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    50% { background: var(--accent2); box-shadow: 0 0 12px var(--accent2); }
  }

  .header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
  .header h1 span { color: var(--accent); }
  .header .version {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .header .actions { display: flex; gap: 8px; margin-left: auto; align-items: center; }

  .header button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--stroke);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
    font-family: inherit;
  }

  .header button:hover { background: var(--panel2); border-color: var(--accent); }
  .header button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .header button.primary:hover { background: var(--accent2); }

  .header select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--stroke);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }

  /* ============ LAYOUT ============ */
  .container { display: flex; height: calc(100vh - 56px); }

  .preview-pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(255, 90, 30, 0.08), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255, 145, 85, 0.05), transparent 50%),
      #0a0505;
    min-width: 0;
  }

  .editor-pane {
    width: 520px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--stroke);
    background: #0d0607;
    flex-shrink: 0;
  }

  #preview-area {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============ MENU WINDOW ============ */
  .menu-window {
    width: 720px;
    height: 480px;
    background: var(--bg);
    border-radius: 14px;
    border: 1.5px solid rgba(255, 90, 30, 0.3);
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 90, 30, 0.1);
  }

  .menu-window.hidden { display: none !important; }

  .menu-window .title-bar {
    height: 44px;
    background: var(--bg2);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    user-select: none;
    cursor: move;
    flex-shrink: 0;
  }

  .menu-window .title-bar .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  .menu-window .title-bar .title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 250px;
  }

  .menu-window .title-bar .subtitle {
    font-size: 11px;
    color: var(--accent);
    margin-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }

  .menu-window .title-bar .stats {
    margin-left: auto;
    font-size: 11px;
    font-family: "Consolas", monospace;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .menu-window .title-bar .win-btns {
    display: flex;
    gap: 6px;
    margin-left: 12px;
    flex-shrink: 0;
  }

  .menu-window .title-bar .win-btn {
    width: 28px;
    height: 28px;
    background: var(--panel);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 700;
  }

  .menu-window .title-bar .win-btn:hover { background: var(--danger); color: white; }
  .menu-window .title-bar .win-btn.minimize:hover { background: var(--accent); }

  .menu-window .body { flex: 1; display: flex; min-height: 0; }

  .menu-window .sidebar {
    width: 160px;
    background: var(--bg2);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    overflow-x: hidden;
    flex-shrink: 0;
  }

  .menu-window .sidebar::-webkit-scrollbar { width: 3px; }
  .menu-window .sidebar::-webkit-scrollbar-track { background: transparent; }
  .menu-window .sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  .menu-window .search {
    height: 26px;
    background: var(--panel);
    border-radius: 6px;
    padding: 0 8px;
    font-size: 11px;
    color: var(--text);
    border: none;
    outline: none;
    margin-bottom: 4px;
    font-family: inherit;
    flex-shrink: 0;
  }
  .menu-window .search::placeholder { color: var(--text-dim); }

  .menu-window .tab-btn {
    height: 34px;
    background: var(--bg2);
    border-radius: 6px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    user-select: none;
  }
  .menu-window .tab-btn:hover { background: var(--panel); }
  .menu-window .tab-btn.active { background: var(--panel); color: var(--text); }
  .menu-window .tab-btn .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

  .menu-window .content {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .menu-window .content::-webkit-scrollbar { width: 4px; }
  .menu-window .content::-webkit-scrollbar-track { background: transparent; }
  .menu-window .content::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; opacity: 0.6; }

  /* ============ ELEMENTS ============ */
  .el-section {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    padding: 6px 0 4px;
    border-bottom: 1px solid var(--stroke);
    position: relative;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .el-section::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 40%;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .el-label {
    font-size: 12px;
    color: var(--text);
    padding: 2px 0;
    word-break: break-word;
    flex-shrink: 0;
    line-height: 1.4;
  }

  .el-button {
    height: 34px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .el-button:hover { background: var(--panel2); }
  .el-button:active { transform: scale(0.98); }

  .el-toggle {
    height: 36px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    flex-shrink: 0;
    gap: 8px;
  }
  .el-toggle .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .el-toggle .track {
    width: 44px;
    height: 22px;
    border-radius: 999px;
    background: var(--panel2);
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .el-toggle .track.on { background: var(--accent); }
  .el-toggle .knob {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    position: absolute;
    top: 3px;
    left: 3px;
    transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .el-toggle .track.on .knob { left: 25px; }

  .el-slider {
    height: 52px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 6px 12px;
    position: relative;
    flex-shrink: 0;
  }
  .el-slider .name {
    font-size: 13px;
    color: var(--text);
    max-width: calc(100% - 100px);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .el-slider .val {
    position: absolute;
    top: 6px;
    right: 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .el-slider .track {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    height: 6px;
    background: var(--panel2);
    border-radius: 999px;
    cursor: pointer;
  }
  .el-slider .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .el-slider .knob {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    background: white;
    border: 2px solid var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .el-input {
    height: 54px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 6px 12px;
    flex-shrink: 0;
  }
  .el-input .name { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .el-input input {
    width: 100%;
    height: 26px;
    background: var(--panel2);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 0 8px;
    font-size: 12px;
    color: var(--text);
    outline: none;
    font-family: "Consolas", monospace;
    transition: all 0.15s;
  }
  .el-input input:focus { background: var(--panel); border-color: var(--accent); }
  .el-input input::placeholder { color: var(--text-dim); }

  .el-dropdown {
    height: 34px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    user-select: none;
  }
  .el-dropdown .label { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .el-dropdown .value { color: var(--accent); font-size: 12px; font-weight: 500; flex-shrink: 0; }
  .el-dropdown .options {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 4px;
    margin-top: 2px;
    display: none;
    flex-direction: column;
    gap: 2px;
    z-index: 50;
    max-height: 200px;
    overflow-y: auto;
  }
  .el-dropdown.open .options { display: flex; }
  .el-dropdown .options::-webkit-scrollbar { width: 4px; }
  .el-dropdown .options::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
  .el-dropdown .option {
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 6px;
    background: var(--panel2);
    transition: background 0.15s;
    cursor: pointer;
  }
  .el-dropdown .option:hover { background: var(--panel); }
  .el-dropdown .option.selected { background: var(--accent); color: white; }

  .el-colorpicker {
    height: 36px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    flex-shrink: 0;
  }
  .el-colorpicker .swatch {
    width: 34px;
    height: 22px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .el-colorpicker .swatch input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .el-keybind {
    height: 36px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 8px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    flex-shrink: 0;
  }
  .el-keybind .key-btn {
    width: 90px;
    height: 24px;
    background: var(--panel2);
    border-radius: 6px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
    font-family: inherit;
  }
  .el-keybind .key-btn.listening { background: var(--warning); color: #000; }
  .el-keybind .key-btn:hover { background: var(--panel); }

  /* ============ NOTIFICATIONS ============ */
  .notifications {
    position: fixed;
    top: 72px;
    right: 20px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
    pointer-events: none;
  }
  .notif {
    background: var(--panel);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    position: relative;
    overflow: hidden;
    transform: translateX(340px);
    opacity: 0;
    animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    pointer-events: all;
  }
  @keyframes slideIn { to { transform: translateX(0); opacity: 1; } }
  .notif.removing { animation: slideOut 0.35s ease forwards; }
  @keyframes slideOut { to { transform: translateX(340px); opacity: 0; } }
  .notif::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent);
  }
  .notif .title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .notif .content { font-size: 12px; color: var(--text); line-height: 1.4; }
  .notif .progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    background: var(--accent);
    width: 100%;
  }
  @keyframes progress { from { width: 100%; } to { width: 0%; } }

  /* ============ LOGO & AVATAR ============ */
  .kpc-logo {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }
  .kpc-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 20px var(--accent));
  }
  .kpc-logo .placeholder {
    font-size: 48px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent);
    letter-spacing: -2px;
  }
  .kpc-logo.hidden { opacity: 0; pointer-events: none; }

  .kpc-avatar {
    position: fixed;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--panel), var(--panel2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    border: 3px solid var(--accent);
    z-index: 50;
    box-shadow: 0 0 20px rgba(255, 90, 30, 0.3);
    transition: opacity 0.2s, border-color 0.3s;
    overflow: hidden;
  }
  .kpc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .kpc-avatar.hidden { opacity: 0; pointer-events: none; }

  /* ============ EDITOR ============ */
  .editor-header {
    height: 40px;
    background: var(--bg2);
    border-bottom: 1px solid var(--stroke);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
    flex-shrink: 0;
  }
  .editor-header .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #code-editor {
    flex: 1;
    width: 100%;
    background: #0a0505;
    color: #f2eeea;
    border: none;
    outline: none;
    padding: 16px;
    font-family: "Consolas", "Monaco", "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }
  #code-editor::-webkit-scrollbar { width: 10px; height: 10px; }
  #code-editor::-webkit-scrollbar-track { background: #0a0505; }
  #code-editor::-webkit-scrollbar-thumb { background: #2a1a15; border-radius: 5px; }
  #code-editor::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .editor-footer {
    height: 36px;
    background: var(--bg2);
    border-top: 1px solid var(--stroke);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .editor-footer .status { flex: 1; font-family: "Consolas", monospace; }
  .editor-footer .status.error { color: var(--danger); }
  .editor-footer .status.success { color: var(--success); }

  @media (max-width: 1100px) {
    .container { flex-direction: column; }
    .editor-pane { width: 100%; height: 45vh; border-left: none; border-top: 1px solid var(--stroke); }
    .preview-pane { height: 55vh; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-dot"></div>
  <h1>KPC<span>UI</span> Playground</h1>
  <span class="version">v1.3.0</span>
  <div class="actions">
    <select id="example-select">
      <option value="">— Ví dụ —</option>
      <option value="basic">Cơ bản</option>
      <option value="combat">Combat Script</option>
      <option value="visual">Visual Script</option>
      <option value="settings">Settings &amp; Theme</option>
      <option value="full">Full Showcase</option>
    </select>
    <button id="btn-run" class="primary">▶ Run</button>
    <button id="btn-reset">🔄 Reset</button>
  </div>
</div>

<div class="container">
  <div class="preview-pane" id="preview-pane">
    <div id="preview-area">
      <div class="menu-window hidden" id="menu-window">
        <div class="title-bar" id="title-bar">
          <div class="dot"></div>
          <div class="title" id="window-title">KPCUI</div>
          <div class="subtitle" id="window-subtitle"></div>
          <div class="stats" id="window-stats"></div>
          <div class="win-btns">
            <div class="win-btn minimize" id="btn-minimize">—</div>
            <div class="win-btn close" id="btn-close">✕</div>
          </div>
        </div>
        <div class="body">
          <div class="sidebar" id="sidebar">
            <input type="text" class="search" placeholder="🔍 Search..." id="tab-search">
          </div>
          <div class="content" id="content"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="editor-pane">
    <div class="editor-header">
      <div class="label">Lua Code</div>
    </div>
    <textarea id="code-editor" spellcheck="false"></textarea>
    <div class="editor-footer">
      <div class="status" id="status">Sẵn sàng</div>
    </div>
  </div>
</div>

<div class="notifications" id="notifications"></div>

<script>
"use strict";

// ============================================================
// THEMES
// ============================================================
const THEMES = {
  BloodRed: { bg:"#0e0806", bg2:"#160d0a", panel:"#1e110d", panel2:"#281711", accent:"#ff5a1e", accent2:"#ff9155", text:"#f2eeea", textDim:"#a5948c", stroke:"#552d1e", success:"#46dc6e", danger:"#ff4646", warning:"#ffc846" },
  DarkBlue: { bg:"#060912", bg2:"#0a101e", panel:"#10182c", panel2:"#16223a", accent:"#4696ff", accent2:"#82beff", text:"#e8f0ff", textDim:"#8296b4", stroke:"#28416e", success:"#46dc6e", danger:"#ff4646", warning:"#ffc846" },

  window: null,

// ============================================================
// HELPERS
// ============================================================
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "style") e.style.cssText = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") {
        e.addEventListener(k.substring(2).toLowerCase(), attrs[k]);
      } else e.setAttribute(k, attrs[k]);
    }
  }
  if (children) {
    if (!Array.isArray(children)) children = [children];
    for (const c of children) {
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    }
  }
  return e;
}

// ============================================================
// LOGO + AVATAR TRACKING
// ============================================================
function trackMenuPosition() {
  const win = document.getElementById("menu-window");
  const logo = state.logo.el;
  const avatar = state.avatar.el;

  if (!win || win.classList.contains("hidden")) {
    if (logo) logo.classList.add("hidden");
    if (avatar) avatar.classList.add("hidden");
    requestAnimationFrame(trackMenuPosition);
    return;
  }

  const rect = win.getBoundingClientRect();
  if (rect.width < 50) {
    if (logo) logo.classList.add("hidden");
    if (avatar) avatar.classList.add("hidden");
    requestAnimationFrame(trackMenuPosition);
    return;
  }

  if (logo && state.logo.enabled) {
    const lgSize = 120;
    const lgX = rect.left + (rect.width - lgSize) / 2;
    const lgY = rect.top - 20;
    logo.style.left = lgX + "px";
    logo.style.top = lgY + "px";
    logo.style.width = lgSize + "px";
    logo.style.height = lgSize + "px";
    logo.classList.remove("hidden");
  } else if (logo) {
    logo.classList.add("hidden");
  }

  if (avatar && state.avatar.enabled) {
    const avSize = 110;
    let avX;
    if (state.avatar.side === "Right") avX = rect.right + 10;
    else avX = rect.left - avSize - 10;
    const avY = rect.top + 70;
    avatar.style.left = avX + "px";
    avatar.style.top = avY + "px";
    avatar.style.width = avSize + "px";
    avatar.style.height = avSize + "px";
    avatar.classList.remove("hidden");
  } else if (avatar) {
    avatar.classList.add("hidden");
  }

  requestAnimationFrame(trackMenuPosition);
}

function Window(name) {
  const win = document.getElementById("menu-window");
  win.classList.remove("hidden");
  win.style.left = "50%";
  win.style.top = "50%";
  win.style.transform = "translate(-50%, -50%)";
  document.getElementById("window-title").textContent = name || "KPCUI";
  document.getElementById("window-subtitle").textContent = "";
  document.getElementById("window-stats").textContent = "FPS: 60 | Ping: 0 ms";

  state.window = win;
  state.tabs = [];
  state.activeTab = null;

  const sidebar = document.getElementById("sidebar");
  const search = document.getElementById("tab-search");
  sidebar.innerHTML = "";
  sidebar.appendChild(search);
  search.value = "";

  document.getElementById("content").innerHTML = "";

  // Create logo if not exists
  if (!state.logo.el) {
    const logo = el("div", { class: "kpc-logo" });
    if (state.logo.image) {
      logo.appendChild(el("img", { src: state.logo.image }));
    } else {
      logo.appendChild(el("div", { class: "placeholder", text: "KPC" }));
    }
    document.body.appendChild(logo);
    state.logo.el = logo;
  }

  // Create avatar
  if (!state.avatar.el) {
    const avatar = el("div", { class: "kpc-avatar" });
    // Dùng dicebear làm avatar mặc định
    const avatarUrl = "https://api.dicebear.com/7.x/bottts/svg?seed=KPC";
    avatar.appendChild(el("img", { src: avatarUrl, alt: "avatar" }));
    document.body.appendChild(avatar);
    state.avatar.el = avatar;
  }

  // Update stats
  if (state._statsInterval) clearInterval(state._statsInterval);
  state._statsInterval = setInterval(() => {
    const fps = Math.floor(58 + Math.random() * 4);
    const ping = Math.floor(20 + Math.random() * 30);
    document.getElementById("window-stats").textContent = `FPS: ${fps} | Ping: ${ping} ms`;
  }, 1000);

  // Search
  search.oninput = () => {
    const q = search.value.toLowerCase();
    document.querySelectorAll(".tab-btn").forEach(btn => {
      const txt = btn.textContent.toLowerCase();
      btn.style.display = (!q || txt.includes(q)) ? "" : "none";
    });
  };

  document.getElementById("btn-close").onclick = () => win.classList.add("hidden");
  document.getElementById("btn-minimize").onclick = () => {
    win.classList.add("hidden");
    setTimeout(() => win.classList.remove("hidden"), 300);
  };

  setupDrag();
  return state;
}

function setupDrag() {
  const win = document.getElementById("menu-window");
  const bar = document.getElementById("title-bar");
  if (!win || !bar) return;

  let dragging = false;
  let startX = 0, startY = 0, origX = 0, origY = 0;

  bar.onmousedown = (e) => {
    if (e.target.closest(".win-btn")) return;
    dragging = true;
    const rect = win.getBoundingClientRect();
    win.style.transform = "none";
    win.style.left = rect.left + "px";
    win.style.top = rect.top + "px";
    startX = e.clientX;
    startY = e.clientY;
    origX = rect.left;
    origY = rect.top;
    e.preventDefault();
  };

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    win.style.left = (origX + dx) + "px";
    win.style.top = (origY + dy) + "px";
  });

  document.addEventListener("mouseup", () => { dragging = false; });
}

function Tab(name, icon) {
  icon = icon || "";
  const sidebar = document.getElementById("sidebar");
  const btn = el("div", { class: "tab-btn" });
  btn.appendChild(el("div", { class: "icon", text: icon }));
  btn.appendChild(el("div", { text: name }));

  const content = document.getElementById("content");

  const tabData = { name, icon, btn, elements: [] };
  state.tabs.push(tabData);

  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.activeTab = tabData;
    content.innerHTML = "";
    for (const fn of tabData.elements) fn();
  };

  sidebar.appendChild(btn);

  // Auto-activate first tab
  if (state.tabs.length === 1) {
    btn.classList.add("active");
    state.activeTab = tabData;
    content.innerHTML = "";
  }

  return tabData;
}

// Helper: append to current tab
function appendElement(fn) {
  const content = document.getElementById("content");
  if (!state.activeTab) {
    // Just append directly if no active tab
    fn(content);
    return;
  }
  state.activeTab.elements.push(() => fn(content));
  // Only render if this is the active tab
  const active = state.tabs.find(t => t.name === state.activeTab.name);
  if (active === state.activeTab) {
    fn(content);
  }
}

    };

  });

function Slider(name, min, max, defaultValue, suffix, callback) {
  appendElement((content) => {
    let value = defaultValue != null ? defaultValue : min;
    suffix = suffix || "";
    const node = el("div", { class: "el-slider" });
    const valEl = el("div", { class: "val", text: Math.round(value) + suffix });
    const track = el("div", { class: "track" });
    const fill = el("div", { class: "fill" });
    const knob = el("div", { class: "knob" });
    const initRel = Math.max(0, Math.min(1, (value - min) / (max - min)));
    fill.style.width = (initRel * 100) + "%";
    knob.style.left = (initRel * 100) + "%";
    track.appendChild(fill);
    track.appendChild(knob);
    node.appendChild(el("div", { class: "name", text: name }));
    node.appendChild(valEl);
    node.appendChild(track);

    let dragging = false;
    const updateFromX = (clientX) => {
      const rect = track.getBoundingClientRect();
      let rel = (clientX - rect.left) / rect.width;
      rel = Math.max(0, Math.min(1, rel));
      value = min + (max - min) * rel;
      fill.style.width = (rel * 100) + "%";
      knob.style.left = (rel * 100) + "%";
      valEl.textContent = Math.round(value * 100) / 100 + suffix;
      try { if (callback) callback(value); } catch (e) {}
    };
    track.onmousedown = (e) => { dragging = true; updateFromX(e.clientX); e.preventDefault(); };
    document.addEventListener("mousemove", (e) => { if (dragging) updateFromX(e.clientX); });
    document.addEventListener("mouseup", () => { dragging = false; });
    content.appendChild(node);
  });
}

function Input(name, placeholder, callback) {
  appendElement((content) => {

    content.appendChild(node);

function Dropdown(name, options, callback) {
  appendElement((content) => {
    options = options || [];
    let current = options[0] || "";
    const node = el("div", { class: "el-dropdown" });
    const label = el("div", { class: "label", text: name });
    const valSpan = el("div", { class: "value", text: current + " ▾" });
    node.appendChild(label);
    node.appendChild(valSpan);
    const optionsEl = el("div", { class: "options" });
    options.forEach(opt => {
      const o = el("div", { class: "option" + (opt === current ? " selected" : ""), text: opt });
      o.onclick = (e) => {
        e.stopPropagation();
        current = opt;
        valSpan.textContent = opt + " ▾";
        optionsEl.querySelectorAll(".option").forEach(x => x.classList.remove("selected"));
        o.classList.add("selected");
        node.classList.remove("open");
        try { if (callback) callback(opt); } catch (err) {}
      };
      optionsEl.appendChild(o);
    });
    node.appendChild(optionsEl);
    node.onclick = (e) => {
      if (e.target.closest(".options")) return;
      document.querySelectorAll(".el-dropdown.open").forEach(d => { if (d !== node) d.classList.remove("open"); });
      node.classList.toggle("open");
    };
    content.appendChild(node);
  });
}

function ColorPicker(name, defaultColor, callback) {

    const swatch = el("div", { class: "swatch" });
    swatch.style.background = defaultColor || "#ff5a1e";
    const inp = el("input", { type: "color" });
    inp.value = defaultColor || "#ff5a1e";
    inp.oninput = () => {
      swatch.style.background = inp.value;
      try { if (callback) callback(inp.value); } catch (e) {}
    };
    swatch.appendChild(inp);
    node.appendChild(swatch);
    content.appendChild(node);
  });
}

function Keybind(name, defaultKey, callback) {
  appendElement((content) => {
    const node = el("div", { class: "el-keybind" });
    node.appendChild(el("div", { text: name }));
    const btn = el("button", { class: "key-btn", text: defaultKey || "F" });
    let listening = false;
    btn.onclick = () => {
      if (listening) return;
      listening = true;
      btn.classList.add("listening");
      btn.textContent = "...";
      const onKey = (e) => {
        e.preventDefault();
        e.stopPropagation();
        listening = false;
        btn.classList.remove("listening");
        btn.textContent = e.key.toUpperCase();
        document.removeEventListener("keydown", onKey, true);
        try { if (callback) callback(e.key.toUpperCase()); } catch (err) {}
      };
      document.addEventListener("keydown", onKey, true);
    };
    node.appendChild(btn);
    content.appendChild(node);
  });
}

// ============================================================
// LUA PARSER — Full implementation
// ============================================================

// Tokenizer
function tokenize(code) {
  const tokens = [];
  let i = 0;
  while (i < code.length) {
    const c = code[i];

    // Whitespace
    if (/\s/.test(c)) { i++; continue; }

    // Comments --[[ ]] or -- line
    if (c === '-' && code[i+1] === '-') {
      if (code[i+2] === '[' && code[i+3] === '[') {
        const end = code.indexOf(']]', i + 4);
        i = end === -1 ? code.length : end + 2;
        continue;
      }
      const nl = code.indexOf('\n', i);
      i = nl === -1 ? code.length : nl;
      continue;
    }

    // Strings "..." or '...'
    if (c === '"' || c === "'") {
      let str = '';
      const quote = c;
      i++;
      while (i < code.length && code[i] !== quote) {
        if (code[i] === '\\') { str += code[i+1]; i += 2; }
        else { str += code[i]; i++; }
      }
      i++;
      tokens.push({ type: 'string', value: str });
      continue;
    }

    // Numbers
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(code[i+1]))) {
      let num = '';
      while (i < code.length && /[0-9.]/.test(code[i])) { num += code[i]; i++; }
      tokens.push({ type: 'number', value: parseFloat(num) });
      continue;
    }

    // Identifiers / keywords
    if (/[a-zA-Z_]/.test(c)) {
      let id = '';
      while (i < code.length && /[a-zA-Z0-9_]/.test(code[i])) { id += code[i]; i++; }
      tokens.push({ type: 'identifier', value: id });
      continue;
    }

    // Operators / punctuation
    const two = code.substring(i, i + 2);
    if (two === '==' || two === '~=' || two === '<=' || two === '>=' || two === '..' || two === 'and' || two === 'or' || two === '..') {
      // handle multi-char
    }
    if (two === '==') { tokens.push({ type: 'op', value: '==' }); i += 2; continue; }
    if (two === '~=') { tokens.push({ type: 'op', value: '~=' }); i += 2; continue; }
    if (two === '..') { tokens.push({ type: 'op', value: '..' }); i += 2; continue; }

    if ('()[]{},.:+-*/%<>=;'.includes(c)) {
      tokens.push({ type: 'punct', value: c });
      i++;
      continue;
    }

    // Unknown - skip
    i++;
  }
  return tokens;
}

// Parser + Evaluator
class LuaParser {
  constructor(tokens, context) {
    this.tokens = tokens;
    this.pos = 0;
    this.ctx = context;
  }

  peek() { return this.tokens[this.pos]; }
  next() { return this.tokens[this.pos++]; }
  expect(value) {
    const t = this.peek();
    if (!t || t.value !== value) throw new Error(`Expected "${value}" but got "${t ? t.value : 'EOF'}"`);
    return this.next();
  }
  match(value) {
    const t = this.peek();
    if (t && t.value === value) { this.next(); return true; }
    return false;
  }

  parse() {
    while (this.pos < this.tokens.length) {
      this.parseStatement();
    }
  }

  parseStatement() {
    const t = this.peek();
    if (!t) return;

    // "end" - stop (handled by block parser)
    if (t.value === 'end') return;

    // Local variable declaration: local x = ...
    if (t.type === 'identifier' && t.value === 'local') {
      this.next();
      const name = this.next().value;
      let value = null;
      if (this.match('=')) value = this.parseExpression();
      this.ctx[name] = value;
      return;
    }

    // Return
    if (t.type === 'identifier' && t.value === 'return') {
      this.next();
      return;
    }

    // Function call or expression
    this.parseExpression();
  }

  parseBlock() {
    const stmts = [];
    while (this.pos < this.tokens.length) {
      const t = this.peek();
      if (!t || t.value === 'end' || t.value === 'else' || t.value === 'elseif') break;
      this.parseStatement();
    }
  }

  parseExpression() {
    return this.parseOr();
  }

  parseOr() {
    let left = this.parseAnd();
    while (this.peek() && this.peek().type === 'identifier' && this.peek().value === 'or') {
      this.next();
      const right = this.parseAnd();
      left = left || right;
    }
    return left;
  }

  parseAnd() {
    let left = this.parseComparison();
    while (this.peek() && this.peek().type === 'identifier' && this.peek().value === 'and') {
      this.next();
      const right = this.parseComparison();
      left = left && right;
    }
    return left;
  }

  parseComparison() {
    let left = this.parseConcat();
    const t = this.peek();
    if (t && (t.value === '==' || t.value === '~=' || t.value === '<' || t.value === '>' || t.value === '<=' || t.value === '>=')) {
      this.next();
      const right = this.parseConcat();
      switch (t.value) {
        case '==': left = left == right; break;
        case '~=': left = left != right; break;
        case '<': left = left < right; break;
        case '>': left = left > right; break;
        case '<=': left = left <= right; break;
        case '>=': left = left >= right; break;
      }
    }
    return left;
  }

  parseConcat() {
    let left = this.parseAdditive();
    while (this.peek() && this.peek().value === '..') {
      this.next();
      const right = this.parseAdditive();
      left = String(left) + String(right);
    }
    return left;
  }

  parseAdditive() {
    let left = this.parseMultiplicative();
    while (this.peek() && (this.peek().value === '+' || this.peek().value === '-')) {
      const op = this.next().value;
      const right = this.parseMultiplicative();
      left = op === '+' ? left + right : left - right;
    }
    return left;
  }

  parseMultiplicative() {
    let left = this.parseUnary();
    while (this.peek() && (this.peek().value === '*' || this.peek().value === '/' || this.peek().value === '%')) {
      const op = this.next().value;
      const right = this.parseUnary();
      if (op === '*') left = left * right;
      else if (op === '/') left = left / right;
      else left = left % right;
    }
    return left;
  }

  parseUnary() {
    const t = this.peek();
    if (t && t.value === '-') {
      this.next();
      return -this.parseUnary();
    }
    if (t && t.type === 'identifier' && t.value === 'not') {
      this.next();
      return !this.parseUnary();
    }
    return this.parsePostfix();
  }

  parsePostfix() {
    let value = this.parsePrimary();

    while (this.pos < this.tokens.length) {
      const t = this.peek();
      if (!t) break;

      // Function call
      if (t.value === '(') {
        const args = this.parseArgs();
        if (typeof value === 'function') {
          value = value.apply(null, args);
        } else {
          value = undefined;
        }
        continue;
      }

      // Method call / index
      if (t.value === '.' || t.value === ':') {
        this.next();
        const name = this.next().value;
        // Method call?
        if (this.peek() && this.peek().value === '(') {
          const args = this.parseArgs();
          if (value && typeof value[name] === 'function') {
            value = value[name].apply(value, args);
          } else {
            value = undefined;
          }
        } else {
          value = value ? value[name] : undefined;
        }
        continue;
      }

      // Index
      if (t.value === '[') {
        this.next();
        const idx = this.parseExpression();
        this.expect(']');
        value = value ? value[idx] : undefined;
        continue;
      }

      break;
    }

    return value;
  }

  parseArgs() {
    this.expect('(');
    const args = [];
    if (!this.match(')')) {
      while (true) {
        args.push(this.parseExpression());
        if (this.match(',')) continue;
        if (this.match(')')) break;
        throw new Error("Expected , or ) in argument list");
      }
    }
    return args;
  }

  parsePrimary() {
    const t = this.next();
    if (!t) throw new Error("Unexpected end of input");

    if (t.type === 'string') return t.value;
    if (t.type === 'number') return t.value;

    if (t.type === 'identifier') {
      const v = t.value;

      // true / false / nil
      if (v === 'true') return true;
      if (v === 'false') return false;
      if (v === 'nil') return null;

      // function
      if (v === 'function') {
        return this.parseFunction();
      }

      // Look up in context
      if (v in this.ctx) return this.ctx[v];

      // Unknown - return undefined (as a function-like value so calls don't crash)
      return undefined;
    }

    if (t.value === '(') {
      const v = this.parseExpression();
      this.expect(')');
      return v;
    }

    if (t.value === '{') {
      // Table
      const arr = [];
      const obj = {};
      let idx = 1;
      if (!this.match('}')) {
        while (true) {
          // [key] = value or key = value or just value
          if (this.peek() && this.peek().value === '[') {
            this.next();
            const k = this.parseExpression();
            this.expect(']');
            this.expect('=');
            const v = this.parseExpression();
            obj[k] = v;
          } else if (this.peek() && this.peek().type === 'identifier' &&
                     this.tokens[this.pos+1] && this.tokens[this.pos+1].value === '=') {
            const k = this.next().value;
            this.next(); // =
            const v = this.parseExpression();
            obj[k] = v;
          } else {
            const v = this.parseExpression();
            arr.push(v);
          }
          if (this.match(',')) continue;
          if (this.match('}')) break;
          if (this.match(';')) continue;
          // try again
          if (this.peek() && this.peek().value === '}') { this.next(); break; }
          throw new Error("Malformed table");
        }
      }
      // Merge
      for (const k in obj) arr[k] = obj[k];
      return arr;
    }

    return undefined;
  }

  parseFunction() {
    this.expect('(');
    const params = [];
    if (!this.match(')')) {
      while (true) {
        const p = this.next();
        if (!p || p.type !== 'identifier') throw new Error("Expected parameter name");
        params.push(p.value);
        if (this.match(',')) continue;
        if (this.match(')')) break;
        throw new Error("Expected , or ) in function params");
      }
    }

    // Parse body until 'end'
    const bodyStart = this.pos;
    let depth = 0;
    let bodyEnd = bodyStart;
    while (bodyEnd < this.tokens.length) {
      const t = this.tokens[bodyEnd];
      if (t.type === 'identifier') {
        if (t.value === 'function' || t.value === 'if' || t.value === 'for' || t.value === 'while') depth++;
        else if (t.value === 'end') {
          if (depth === 0) break;
          depth--;
        }
      }
      bodyEnd++;
    }

    const bodyTokens = this.tokens.slice(bodyStart, bodyEnd);
    this.pos = bodyEnd;
    this.expect('end');

    // Return a JS function that, when called, creates a new parser and runs body
    const self = this;
    const fn = function(...args) {
      const newCtx = Object.create(self.ctx);
      for (let i = 0; i < params.length; i++) {
        newCtx[params[i]] = args[i];
      }
      const subParser = new LuaParser(bodyTokens, newCtx);
      try { subParser.parse(); }
      catch (e) { console.warn("Function body error:", e.message); }
    };
    return fn;
  }
}

// ============================================================
// RUN
// ============================================================
function parseAndRun(code) {
  setStatus("Đang chạy...");

  // Reset
  document.getElementById("menu-window").classList.add("hidden");
  document.querySelectorAll(".kpc-logo, .kpc-avatar").forEach(n => n.remove());
  state.logo.el = null;
  state.avatar.el = null;
  state.tabs = [];
  state.activeTab = null;
  document.getElementById("content").innerHTML = "";

  // Context
  const ctx = {
    Window, Tab, Section, Label, Button, Toggle, Slider, Input, Dropdown,
    ColorPicker, Keybind, Notify,
    SetTheme: applyTheme,
    SetLogoEnabled: (v) => { state.logo.enabled = !!v; },
    SetLogoImage: (url) => { state.logo.image = url; if (state.logo.el) state.logo.el.innerHTML = `<img src="${url}">`; },
    SetAvatarEnabled: (v) => { state.avatar.enabled = !!v; },
    SetAvatarSide: (v) => { state.avatar.side = v; },
    print: (...args) => console.log(...args),
    warn: (...args) => console.warn(...args),
    task: {
      wait: () => {},
      spawn: (fn) => { try { fn(); } catch(e) {} },
      delay: () => {},
    },
    wait: () => {},
  };

  try {
    const tokens = tokenize(code);
    const parser = new LuaParser(tokens, ctx);
    parser.parse();
    setStatus("✅ Chạy thành công (" + tokens.length + " tokens)", "success");
  } catch (err) {
    console.error(err);
    setStatus("❌ " + err.message, "error");
  }
}

// ============================================================
// INIT
// ============================================================
document.addEventListener("DOMContentLoaded", () => {
  applyTheme("BloodRed");
  requestAnimationFrame(trackMenuPosition);

  const editor = document.getElementById("code-editor");

  // Tab key support
  editor.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = editor.selectionStart;
      const e2 = editor.selectionEnd;
      editor.value = editor.value.substring(0, s) + "    " + editor.value.substring(e2);
      editor.selectionStart = editor.selectionEnd = s + 4;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      runCode();
    }
  });

  document.getElementById("btn-run").onclick = runCode;

  document.getElementById("btn-reset").onclick = () => {
    document.getElementById("menu-window").classList.add("hidden");
    document.querySelectorAll(".kpc-logo, .kpc-avatar").forEach(n => n.remove());
    state.logo.el = null;
    state.avatar.el = null;
    state.tabs = [];
    state.activeTab = null;
    document.getElementById("content").innerHTML = "";
    const sidebar = document.getElementById("sidebar");
    const search = document.getElementById("tab-search");
    sidebar.innerHTML = "";
    sidebar.appendChild(search);
    search.value = "";
    setStatus("Đã reset");
  };

  document.getElementById("example-select").onchange = (e) => {
    const key = e.target.value;
    if (EXAMPLES[key]) {
      editor.value = EXAMPLES[key];
      setStatus("Đã load ví dụ: " + key);
    }
  };

  editor.value = EXAMPLES.basic;

  function runCode() {
    const code = editor.value;
    if (!code.trim()) { setStatus("Code trống", "error"); return; }
    parseAndRun(code);
  }
});
