<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Generator - KPCH</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  h1 {
    font-size: 20px;
    margin-bottom: 6px;
    background: linear-gradient(90deg,#38bdf8,#a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 12px; color: #64748b; margin-bottom: 22px; }
  .row { margin-bottom: 16px; }
  label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
    color: #cbd5e1;
  }
  label span.tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #334155;
    color: #94a3b8;
  }
  input[type=number] {
    width: 100%;
    padding: 11px 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #f1f5f9;
    font-size: 15px;
    outline: none;
    transition: border .2s;
  }
  input[type=number]:focus { border-color: #38bdf8; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(90deg,#0ea5e9,#8b5cf6);
    color: #fff;
    transition: transform .15s, opacity .2s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: .5; cursor: wait; transform: none; }
  .stats {
    margin-top: 18px;
    font-size: 12px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
  }
  .stats b { color: #38bdf8; }
</style>
</head>
<body>
<div class="box">
  <h1>🔑 KPCH Key Generator</h1>
  <p class="sub">Format: KPCH + 12 ký tự random (tổng 16) · Xuất file .lua</p>

  <div class="row">
    <label>1 HR <span class="tag">3600s</span></label>
    <input type="number" id="c1hr" value="200" min="0" max="100000">
  </div>
  <div class="row">
    <label>2 HR <span class="tag">7200s</span></label>
    <input type="number" id="c2hr" value="200" min="0" max="100000">
  </div>
  <div class="row">
    <label>1 DAY <span class="tag">86400s</span></label>
    <input type="number" id="c1day" value="200" min="0" max="100000">
  </div>
  <div class="row">
    <label>LIMIT <span class="tag">999999999s</span></label>
    <input type="number" id="climit" value="200" min="0" max="100000">
  </div>

  <button id="btn" onclick="generate()">⚡ Tạo & Tải File Lua</button>

  <div class="stats">
    <span>Tổng key: <b id="total">800</b></span>
    <span id="time"></span>
  </div>
</div>

<script>
const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const used = new Set();

function randKey() {
  // 12 ký tự random, đảm bảo không trùng
  let key;
  do {
    let s = "";
    for (let i = 0; i < 12; i++) {
      s += CHARS[Math.floor(Math.random() * CHARS.length)];
    }
    key = "KPCH" + s;
  } while (used.has(key));
  used.add(key);
  return key;
}

function block(count, duration, type, title) {
  const lines = [];
  if (count <= 0) return "";
  lines.push("    -- ============================================================");
  lines.push(`    -- ${title} (${duration} giây) — ${count} key`);
  lines.push("    -- ============================================================");
  for (let i = 0; i < count; i++) {
    const key = randKey();
    lines.push(`    ["${key}"] = { duration = ${duration},${" ".repeat(Math.max(0, 14 - String(duration).length))}type = "${type}" },`);
  }
  return lines.join("\n");
}

async function generate() {
  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "⏳ Đang tạo...";

  // cho UI kịp render
  await new Promise(r => setTimeout(r, 20));

  const t0 = performance.now();

  const n1hr  = Math.min(100000, Math.max(0, +document.getElementById("c1hr").value  || 0));
  const n2hr  = Math.min(100000, Math.max(0, +document.getElementById("c2hr").value  || 0));
  const n1day = Math.min(100000, Math.max(0, +document.getElementById("c1day").value || 0));
  const nlim  = Math.min(100000, Math.max(0, +document.getElementById("climit").value|| 0));

  const total = n1hr + n2hr + n1day + nlim;
  if (total === 0) {
    alert("Nhập ít nhất 1 key!");
    btn.disabled = false;
    btn.textContent = "⚡ Tạo & Tải File Lua";
    return;
  }

  used.clear();

  const parts = [
    "-- keys.lua",
    "-- Auto-generated key file",
    `-- Tổng: ${total} key`,
    "-- Format: KPCH + 12 ký tự random (tổng 16)",
    "-- duration: 3600 = 1hr, 7200 = 2hr, 86400 = 1day, 999999999 = limit",
    "",
    "return {"
  ];

  const b1 = block(n1hr,  3600,      "1hr",   "1 HR");
  const b2 = block(n2hr,  7200,      "2hr",   "2 HR");
  const b3 = block(n1day, 86400,     "1day",  "1 DAY");
  const b4 = block(nlim,  999999999, "limit", "LIMIT");

  [b1, b2, b3, b4].forEach(b => {
    if (b) {
      parts.push(b);
      parts.push("");
    }
  });

  parts.push("}");

  const lua = parts.join("\n");

  // tải file
  const blob = new Blob([lua], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "keys.lua";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  const dt = ((performance.now() - t0) / 1000).toFixed(3);
  document.getElementById("total").textContent = total.toLocaleString("vi-VN");
  document.getElementById("time").textContent = `⏱ ${dt}s`;

  btn.disabled = false;
  btn.textContent = "⚡ Tạo & Tải File Lua";
}
</script>
</body>
</html>
